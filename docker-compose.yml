networks:
  dev:
    external: true

services:
  dry-mollie-dev:
    build: https://github.com/TallieuTallieu/dry-docker.git#php8.4
    hostname: docker_app
    volumes:
      - .:/var/www/html
      # composer.json resolves tallieutallieu/dry-ecommerce from a path
      # repository at ../dry-ecommerce, which is outside the project mount.
      - ../dry-ecommerce:/var/www/dry-ecommerce
      - ~/.ssh:/root/.ssh:ro
    ports:
      - '80'
    networks:
      - dev
    command:
      [
        'sh',
        '-c',
        'eval `ssh-agent -s` && ssh-add && composer install && apache2ctl -D FOREGROUND',
      ]
